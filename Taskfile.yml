version: '3'

vars:
  BIN: bin/malachi-memory
  # Where install puts the binary MCP clients run as `malachi-memory`.
  # Override with: task install INSTALL_PATH=/some/path
  INSTALL_PATH:
    sh: echo "$HOME/.local/bin/malachi-memory"

tasks:
  build:
    desc: Build {{.BIN}}
    sources: ['**/*.go', go.mod, go.sum]
    generates: ['{{.BIN}}']
    cmds:
      - go build -o {{.BIN}} .

  install:
    desc: Build and install malachi-memory (default ~/.local/bin)
    deps: [build]
    cmds:
      - mkdir -p "$(dirname '{{.INSTALL_PATH}}')"
      # Copy beside the target, then rename over it, so a session starting
      # mid-install never runs a half-written binary.
      - cp {{.BIN}} '{{.INSTALL_PATH}}.tmp'
      - mv -f '{{.INSTALL_PATH}}.tmp' '{{.INSTALL_PATH}}'
      - echo "installed $('{{.INSTALL_PATH}}' --version) at {{.INSTALL_PATH}}"
      # Warn if another malachi-memory would run instead.
      - |
        found="$(command -v malachi-memory || true)"
        if [ "$found" != '{{.INSTALL_PATH}}' ]; then
          echo "warning: malachi-memory on PATH is ${found:-missing}, not {{.INSTALL_PATH}}" >&2
        fi
