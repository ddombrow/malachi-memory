[package]
name = "malachi-memory"
version = "0.1.0"
edition = "2024"
description = "A small MCP memory server on an embedded Grafeo graph"
license = "Apache-2.0"

[dependencies]
# Pinned. grafeo 0.6.2 is newer than the usual two weeks: a bugfix release, chosen deliberately.
grafeo = { version = "=0.6.2", default-features = false, features = ["gql", "text-index", "grafeo-file", "wal", "regex"] }
serde_json = "=1.0.154"

[profile.release]
strip = true
